name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: pytest -q
      - name: Check database provisioning command starts correctly
        run: python scripts/create_database.py --help
      - name: Check house-ad seed command starts correctly
        run: python scripts/seed_house_ads.py --help
      - name: Check live delivery smoke test command starts correctly
        run: python scripts/smoke_test_delivery.py --help
      - name: Ensure production-style seed refuses accidental SQLite writes
        shell: bash
        run: |
          if python scripts/seed_house_ads.py --apply; then
            echo "ERROR: seed unexpectedly allowed SQLite writes without --allow-sqlite"
            exit 1
          fi
