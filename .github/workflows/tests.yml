name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: pytest -q
      - name: Smoke-test database migrations on isolated SQLite
        env:
          AI_PUBLICIDAD_ENV: test
          AI_PUBLICIDAD_DATABASE_URL: sqlite:///./migration-check.sqlite3
        run: python -m alembic upgrade head
      - name: Check web interface JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; \
          names=('admin.html','layout_lab.html'); \
          [(lambda p: Path('/tmp/ai_publicidad_'+p.stem+'.js').write_text(re.search(r'<script>(.*?)</script>', p.read_text(encoding='utf-8'), re.S).group(1), encoding='utf-8'))(Path('api/static')/name) for name in names]"
          node --check /tmp/ai_publicidad_admin.js
          node --check /tmp/ai_publicidad_layout_lab.js
      - name: Check database provisioning command starts correctly
        run: python scripts/create_database.py --help
      - name: Check house-ad seed command starts correctly
        run: python scripts/seed_house_ads.py --help
      - name: Check OpenMusicRepository campaign seed command starts correctly
        run: python scripts/seed_omr_campaign.py --help
      - name: Check live delivery smoke test command starts correctly
        run: python scripts/smoke_test_delivery.py --help
      - name: Ensure production-style seed refuses accidental SQLite writes
        shell: bash
        run: |
          if python scripts/seed_house_ads.py --apply; then
            echo "ERROR: seed unexpectedly allowed SQLite writes without --allow-sqlite"
            exit 1
          fi
