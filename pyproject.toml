[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-publicidad"
version = "0.1.0"
description = "Servicio independiente de publicidad directa para OSAP y otras aplicaciones."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
ai-publicidad-api = "api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["api", "domain", "application", "infrastructure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
